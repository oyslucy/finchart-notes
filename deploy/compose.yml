services:
  app:
    image: ghcr.io/oyslucy/finchart-notes:latest
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
    expose:
      - "8000"
    mem_limit: 384m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
