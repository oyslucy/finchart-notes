services:
  app:
    image: ghcr.io/oyslucy/finchart-notes:latest
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATA_DIR: /data
    volumes:
      - app_data:/data
    expose:
      - "8000"
    mem_limit: 384m
    restart: unless-stopped

  # Same image; uploads a nightly archive of /data to Oracle Object Storage.
  backup:
    image: ghcr.io/oyslucy/finchart-notes:latest
    command: ["python", "-m", "finchart_api.backup", "schedule"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - app_data:/data
    mem_limit: 192m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
  caddy_config:
